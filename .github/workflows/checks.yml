name: Project checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m flake8 .
      - run: python -m black --check --workers 1 .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py spectacular --file schema.yml --validate --fail-on-warn
      - run: python -m coverage run manage.py test
      - run: python -m coverage report -m --fail-under=60
